name: Tests & Build
on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main
      - dev
      - feature/*
      - fix/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm install
      - run: npm run build


  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: safe_area_db
          MYSQL_USER: admin
          MYSQL_PASSWORD: Azerty@123
          MYSQL_ROOT_PASSWORD: Azerty@123
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_ROOT_USER: root
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
#      - name: Init database
#        run: mysql -uroot -h127.0.0.1 --port=${{ job.services.mysql.ports[3306] }} -e 'CREATE DATABASE IF NOT EXISTS safe_area_db;'
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.1'
      - uses: actions/checkout@v3
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Optimize artisan
        run: php artisan optimize:clear
      - name: Migration
        run: php artisan migrate:fresh --seed
      - name: Ziggy generate
        run: php artisan ziggy:generate
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/phpunit
