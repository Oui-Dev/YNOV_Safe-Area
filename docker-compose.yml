version: '3.8'

services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - laravel

  # Serveur MySQL
  db:
    image: mysql:5.7
    container_name: mysql_db
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - laravel

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    ports:
      - '8080:80'
    networks:
      - laravel

# Volumes pour la persistance des données MySQL
volumes:
  dbdata:

# Réseau pour la communication entre les conteneurs
networks:
  laravel:
